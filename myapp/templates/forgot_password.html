{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container">
    <div class="forgot-password-card">
        <h2 class="text-center">Forgot Password</h2>

        <!-- Error Message -->
        {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
        {% endif %}

        <!-- Forgot Password Form -->
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>
        </form>
    </div>
</div>

<style>
    /* Basic Container Style */
    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 30px 15px;
    }

    /* Forgot Password Card Styling */
    .forgot-password-card {
        background-color: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Centered text */
    .text-center {
        text-align: center;
    }

    /* Error Message Styling */
    .alert {
        background-color: #f8d7da;
        border-color: #f5c6cb;
        color: #721c24;
        border-radius: 5px;
        padding: 10px;
        margin-bottom: 15px;
    }

    /* Button Styling */
    .btn-primary {
        background-color: #007bff;
        border-color: #007bff;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        text-transform: uppercase;
        cursor: pointer;
        border: none;
    }

    .btn-primary:hover {
        background-color: #0056b3;
        border-color: #004085;
    }

    /* Form Styling */
    form p {
        font-size: 1rem;
        margin-bottom: 10px;
    }
</style>
{% endblock %}
